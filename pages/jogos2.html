<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogos da marca — 6726.Bet</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/animations.css" />
</head>
<body>
  <div class="container section">
    <div class="row mb-12">
      <a class="back-btn" href="jogos.html">←</a>
      <h2 id="brand-title" style="margin:0">Marca</h2>
    </div>

    <div class="brand-strip mb-16" id="brand-strip"></div>

    <div class="hero-carousel mb-16" id="brand-hero" style="aspect-ratio:800/360"></div>

    <div class="game-grid" id="games-grid"></div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/assets.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/games.js"></script>
  <script src="../games/tiger.js"></script>
  <script src="../games/rabbit.js"></script>
  <script src="../games/tigrinho.js"></script>
  <script src="../games/pg.js"></script>
  <script src="../games/spin.js"></script>
  <script src="../games/dragon.js"></script>
  <script src="../games/fortune.js"></script>
  <script>
    (function () {
      App.boot({ requireAuth: true, nav: "inicio" });
      var params = new URLSearchParams(location.search);
      var key = params.get("brand") || (Games.listBrands()[0] && Games.listBrands()[0].key);
      var brand = Games.getBrand(key);
      if (!brand) { location.replace("jogos.html"); return; }
      document.getElementById("brand-title").textContent = brand.icon + " " + brand.name;

      var strip = document.getElementById("brand-strip");
      Games.listBrands().forEach(function (b) {
        var c = U.el("a", {
          cls: "brand-chip" + (b.key === brand.key ? " active" : ""),
          attrs: { href: "jogos2.html?brand=" + encodeURIComponent(b.key) },
          text: b.icon + " " + b.name
        });
        strip.appendChild(c);
      });

      // Brand hero banner
      var hero = document.getElementById("brand-hero");
      hero.innerHTML = '<div class="hc-track"><div class="hc-slide"><img src="' + Assets.brandBanner(brand.key) + '" alt="' + U.escapeHtml(brand.name) + '"/></div></div>';

      var grid = document.getElementById("games-grid");
      brand.games.forEach(function (g, i) {
        var ribbon = i < 3 ? '<div class="gc-ribbon top">DESTAQUE</div>' : (i < 7 ? '<div class="gc-ribbon hot">HOT</div>' : '');
        var el = U.el("a", { cls: "game-card", attrs: { href: "jogos3.html?id=" + encodeURIComponent(g.id) } });
        el.innerHTML =
          ribbon +
          '<div class="gc-rtp">' + Math.round(g.rtp * 100) + '%</div>' +
          '<div class="gc-thumb" style="background-image:url(' + Assets.gameThumb(g.id) + ')"></div>' +
          '<div class="gc-name"><div class="n">' + U.escapeHtml(g.name) + '</div><div class="t">' + U.escapeHtml(brand.name) + '</div></div>';
        grid.appendChild(el);
      });
    })();
  </script>
</body>
</html>
